name: Patch recibo cuota mensual

on:
  push:
    paths:
      - '.github/workflows/patch-recibo-cuota.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir calculo de recibos
        run: python3 scripts/patch_receipt_calc.py
      - name: Verificar build
        run: npm ci && npm run build
      - name: Publicar correccion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios para publicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/InsuranceCollections.tsx
          git commit -m "Corregir calculo automatico de recibos por mes"
          git push origin HEAD:main
